<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a942"/>
      <stop offset="25%" style="stop-color:#c49a38"/>
      <stop offset="50%" style="stop-color:#b8892e"/>
      <stop offset="75%" style="stop-color:#d4a942"/>
      <stop offset="100%" style="stop-color:#a67c28"/>
    </linearGradient>
    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0be5a"/>
      <stop offset="30%" style="stop-color:#c49a38"/>
      <stop offset="60%" style="stop-color:#a67c28"/>
      <stop offset="100%" style="stop-color:#d4a942"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b6914"/>
      <stop offset="50%" style="stop-color:#c49a38"/>
      <stop offset="100%" style="stop-color:#e0be5a"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </radialGradient>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="metallic">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#d4a942" surfaceScale="2" result="light">
        <feDistantLight azimuth="135" elevation="45"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="0.8" k2="0.3" k3="0" k4="0"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#gold1)" stroke-width="16"/>
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#gold2)" stroke-width="2" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#gold3)" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner ring -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#gold2)" stroke-width="6"/>
  
  <!-- Letter H - Left -->
  <!-- Left vertical bar -->
  <rect x="120" y="130" width="38" height="240" rx="4" fill="url(#gold1)" filter="url(#innerGlow)"/>
  <!-- Left serifs top -->
  <rect x="105" y="125" width="68" height="16" rx="3" fill="url(#gold2)"/>
  <!-- Left serifs bottom -->
  <rect x="105" y="359" width="68" height="16" rx="3" fill="url(#gold2)"/>
  
  <!-- Right vertical bar of first H / Left vertical bar of second H (shared) -->
  <rect x="232" y="130" width="38" height="240" rx="4" fill="url(#gold1)" filter="url(#innerGlow)"/>
  
  <!-- Letter H - Right -->
  <!-- Right vertical bar -->
  <rect x="342" y="130" width="38" height="240" rx="4" fill="url(#gold1)" filter="url(#innerGlow)"/>
  <!-- Right serifs top -->
  <rect x="327" y="125" width="68" height="16" rx="3" fill="url(#gold2)"/>
  <!-- Right serifs bottom -->
  <rect x="327" y="359" width="68" height="16" rx="3" fill="url(#gold2)"/>
  
  <!-- Crossbar left H -->
  <rect x="120" y="232" width="150" height="36" rx="4" fill="url(#gold2)" filter="url(#innerGlow)"/>
  
  <!-- Crossbar right H -->
  <rect x="232" y="232" width="148" height="36" rx="4" fill="url(#gold2)" filter="url(#innerGlow)"/>
  
  <!-- HISPANA banner -->
  <rect x="140" y="278" width="220" height="38" rx="3" fill="url(#gold1)" filter="url(#innerGlow)"/>
  <rect x="140" y="278" width="220" height="2" fill="#e0be5a" opacity="0.5"/>
  <rect x="140" y="314" width="220" height="2" fill="#8b6914" opacity="0.5"/>
  
  <!-- HISPANA text -->
  <text x="250" y="304" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="6" fill="#1a1a1a">HISPANA</text>
  <text x="250" y="304" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="6" fill="url(#gold3)" opacity="0.4">HISPANA</text>

  <!-- Highlights/reflections -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="16"/>
  <ellipse cx="200" cy="170" rx="80" ry="40" fill="rgba(255,255,255,0.02)" transform="rotate(-20 200 170)"/>
</svg>
